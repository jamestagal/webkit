name: Pull Request

on:
  pull_request:

jobs:
  lint-service-core:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: app/service-core
  lint-service-admin:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: app/service-admin
  lint-service-client:
    uses: ./.github/workflows/lint-ts.yml
    with:
      working-directory: apps/service-client
  lint-marketing:
    # Inline rather than reuse lint-ts.yml — marketing is a pnpm-workspace
    # package; lint-ts.yml uses `npm i` which doesn't see the root pnpm-lock.yaml
    # and would generate a divergent package-lock.json. Mirrors deploy-marketing.yml
    # setup (pnpm@10.33.2 + Node 22) so PR CI catches what production deploy
    # would catch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webkit/marketing lint
      - run: pnpm --filter @webkit/marketing build
  tier-limits-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Regenerate tier-limits.ts
        run: go generate ./...
        working-directory: app
      - name: Fail if generated TS diverges from Go source
        run: git diff --exit-code -- apps/service-client/src/lib/generated/
