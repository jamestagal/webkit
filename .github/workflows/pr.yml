name: Pull Request

on:
  pull_request:

jobs:
  lint-service-core:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: app/service-core
  lint-service-admin:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: app/service-admin
  lint-service-client:
    uses: ./.github/workflows/lint-ts.yml
    with:
      working-directory: service-client
  tier-limits-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Regenerate tier-limits.ts
        run: go generate ./...
        working-directory: app
      - name: Fail if generated TS diverges from Go source
        run: git diff --exit-code -- service-client/src/lib/generated/
