name: Deploy Marketing

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-marketing.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @webkit/marketing build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          # Astro adapter generates dist/server/wrangler.json with canonical
          # asset paths (assets serve from dist/client). User-config
          # apps/marketing/wrangler.jsonc is metadata-only.
          command: deploy --config dist/server/wrangler.json
