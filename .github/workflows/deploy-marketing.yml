name: Deploy Marketing

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/tokens/**"
      - "packages/billing-tokens/**"
      - ".github/workflows/deploy-marketing.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @webkit/marketing build

      - name: Deploy to Cloudflare Workers
        # Bypass cloudflare/wrangler-action@v3 — its `npx --no-install wrangler`
        # lookup can't see pnpm symlinks, then falls back to npm-installing
        # wrangler@3.90.0 (older than our v4 transitive dep, plus the global
        # install trips nested postinstall failures). Direct pnpm exec is the
        # same path as local dev and uses the workspace-pinned wrangler.
        # Astro adapter generates dist/server/wrangler.json with canonical
        # asset paths (assets serve from dist/client); user-config
        # apps/marketing/wrangler.jsonc is metadata-only.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @webkit/marketing exec wrangler deploy --config dist/server/wrangler.json
